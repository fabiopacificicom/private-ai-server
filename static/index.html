<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private AI — Chat</title>
  <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css'
    integrity='sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A=='
    crossorigin='anonymous' referrerpolicy='no-referrer' />
  <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'
    integrity='sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH' crossorigin='anonymous'>
  <style>
    :root {
      --bg: #0f1420;
      --bg-2: #1a2233;
      --bg-3: #232e45;
      --accent: #4f8cff;
      --accent-2: #7a5cff;
      --text: #e6ecf5;
      --text-muted: #8b9bb4;
      --border: #2c3a55;
      --user-bubble: #4f8cff;
      --assistant-bubble: #1a2233;
      --success: #2fbf71;
      --danger: #e5534b;
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      overflow: hidden;
    }
    /* Sidebar */
    .sidebar {
      width: 280px;
      background: var(--bg-2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      padding: 1rem;
      gap: 1rem;
      overflow-y: auto;
      transition: width 0.25s ease, padding 0.25s ease, opacity 0.2s ease;
    }
    body.sidebar-collapsed .sidebar {
      width: 60px;
      padding: 1rem 0.6rem;
    }
    body.sidebar-collapsed .sidebar .section,
    body.sidebar-collapsed .sidebar .brand-text,
    body.sidebar-collapsed .sidebar .sidebar-toggle-label {
      display: none;
    }
    body.sidebar-collapsed .sidebar .brand {
      justify-content: center;
    }
    /* Narrow, subtle scrollbar (WebKit/Chromium) */
    .sidebar::-webkit-scrollbar {
      width: 6px;
    }
    .sidebar::-webkit-scrollbar-track {
      background: transparent;
    }
    .sidebar::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }
    .sidebar::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }
    /* Firefox */
    .sidebar {
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .sidebar h5 { color: var(--text); font-weight: 600; margin: 0; display: flex; align-items: center; gap: 0.5rem; }
    .sidebar .section { display: flex; flex-direction: column; gap: 0.5rem; }
    .sidebar label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin: 0; }
    /* Brand (matches setup wizard) */
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
    .brand-logo {
      width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent), #7a5cff);
      display: grid; place-items: center; font-size: 22px; color: #fff;
    }
    .brand-title { font-weight: 700; font-size: 17px; line-height: 1.2; }
    .brand-sub { font-size: 12px; color: var(--text-muted); }
    /* Sidebar collapse toggle */
    .sidebar-toggle {
      display: flex; align-items: center; justify-content: space-between;
      gap: 0.5rem; margin-top: auto; padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
    .sidebar-toggle-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
    .sidebar-toggle-btn {
      background: transparent; border: 1px solid var(--border);
      color: var(--text-muted); border-radius: 0.5rem;
      width: 30px; height: 30px; cursor: pointer;
      display: grid; place-items: center; transition: background 0.2s, color 0.2s;
    }
    .sidebar-toggle-btn:hover { background: var(--bg-3); color: var(--text); }
    .sidebar-toggle-btn .fa-angle-left { display: none; }
    body.sidebar-collapsed .sidebar-toggle-btn .fa-angle-left { display: inline; }
    body.sidebar-collapsed .sidebar-toggle-btn .fa-angle-right { display: none; }
    body.sidebar-collapsed .sidebar-toggle { justify-content: center; border-top: none; }
    .form-select, .form-control {
      background: var(--bg) !important;
      color: var(--text) !important;
      border: 1px solid var(--border) !important;
      border-radius: 0.5rem;
    }
    .form-select:focus, .form-control:focus {
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 0.2rem rgba(79,140,255,0.25) !important;
    }
    .btn { border-radius: 0.5rem; font-weight: 500; }
    .btn-primary { background: var(--accent); border: none; }
    .btn-primary:hover { background: var(--accent-2); }
    .btn-outline-secondary { color: var(--text); border-color: var(--border); }
    .btn-outline-secondary:hover { background: var(--bg-3); color: var(--text); border-color: var(--bg-3); }
    .btn-outline-primary { color: var(--accent); border-color: var(--accent); }
    .btn-outline-primary:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .stat {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.6rem;
    }
    .stat .val { font-size: 1.1rem; font-weight: 600; }
    .stat .lbl { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
    .badge { font-size: 0.7rem; }
    .model-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.6rem;
      margin-top: 0.25rem;
      display: none;
    }
    .services-panel {
      font-size: 0.75rem;
      color: var(--text-muted);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.6rem;
      margin-top: 0.25rem;
    }
    .hub-results {
      max-height: 180px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 0.4rem;
      background: var(--bg);
      margin-top: 0.4rem;
    }
    .hub-results .hub-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.6rem;
      cursor: pointer;
      font-size: 0.72rem;
      border-bottom: 1px solid var(--border);
    }
    .hub-results .hub-item:last-child { border-bottom: none; }
    .hub-results .hub-item:hover { background: var(--bg-3); }
    .hub-results .hub-item.selected { background: var(--accent); color: #fff; }
    .hub-results .hub-id { word-break: break-all; }
    .hub-results .hub-meta { color: var(--text-muted); white-space: nowrap; font-size: 0.65rem; }
    .hub-results .hub-item.selected .hub-meta { color: rgba(255,255,255,0.8); }
    .services-panel .svc {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.25rem 0;
    }
    .services-panel .svc + .svc { border-top: 1px solid var(--border); }
    .svc-name { font-weight: 600; }
    .svc-install-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 0.35rem;
      padding: 0.1rem 0.4rem;
      font-size: 0.7rem;
      cursor: pointer;
    }
    .svc-install-btn:hover { color: var(--text); border-color: var(--text-muted); }
    .wizard-svc {
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.75rem;
      margin-bottom: 0.75rem;
      background: var(--bg);
    }
    .wizard-svc code {
      display: block;
      background: var(--bg-3);
      padding: 0.5rem;
      border-radius: 0.4rem;
      font-size: 0.75rem;
      word-break: break-all;
      margin-top: 0.5rem;
    }
    /* Main */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
    .chat-header {
      padding: 0.75rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--bg);
    }
    .chat-header h5 { margin: 0; font-weight: 600; }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background: var(--bg);
    }
    .msg { max-width: 78%; display: flex; flex-direction: column; gap: 0.25rem; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.assistant { align-self: flex-start; align-items: flex-start; }
    .bubble {
      padding: 0.7rem 1rem;
      border-radius: 1rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 0.95rem;
    }
    .msg.user .bubble { background: var(--user-bubble); color: #fff; border-bottom-right-radius: 0.25rem; }
    .msg.assistant .bubble { background: var(--assistant-bubble); border: 1px solid var(--border); border-bottom-left-radius: 0.25rem; }
    .msg .meta { font-size: 0.7rem; color: var(--text-muted); }
    .think {
      background: rgba(148,163,184,0.12);
      border-radius: 0.5rem;
      padding: 0.5rem 0.75rem;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      max-height: 150px;
      overflow-y: auto;
      border-left: 3px solid var(--accent);
    }
    .think::before { content: '🧠 Reasoning'; display: block; font-weight: 600; font-size: 0.7rem; margin-bottom: 0.25rem; }
    .copy-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 0.35rem;
      padding: 0.15rem 0.5rem;
      font-size: 0.7rem;
      cursor: pointer;
    }
    .copy-btn:hover { color: var(--text); border-color: var(--text-muted); }
    .writing { color: var(--text-muted); font-style: italic; font-size: 0.9rem; }
    .writing::after { content: '▋'; animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    /* Input */
    .input-area { padding: 1rem 1.5rem; border-top: 1px solid var(--border); background: var(--bg); }
    .input-row { display: flex; gap: 0.5rem; max-width: 900px; margin: 0 auto; }
    .input-row textarea {
      flex: 1;
      resize: none;
      background: var(--bg-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      min-height: 48px;
      max-height: 180px;
    }
    .input-row textarea:focus { outline: none; border-color: var(--accent); }
    .input-row button { border-radius: 0.75rem; padding: 0 1.25rem; font-size: 1rem; }
    .input-hint { text-align: center; font-size: 0.7rem; color: var(--text-muted); margin-top: 0.5rem; }
    /* Mode tabs */
    .mode-tabs {
      display: flex;
      gap: 0.35rem;
      max-width: 900px;
      margin: 0 auto 0.5rem;
    }
    .mode-tab {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 0.6rem;
      padding: 0.3rem 0.8rem;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .mode-tab:hover { color: var(--text); border-color: var(--text-muted); }
    .mode-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .gen-status {
      max-width: 900px;
      margin: 0.5rem auto 0;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
    }
    .gen-status.error { color: var(--danger); }
    /* Generated media in messages */
    .msg .bubble img.gen-img {
      max-width: 100%;
      border-radius: 0.5rem;
      display: block;
    }
    .msg .bubble audio.gen-audio { width: 100%; margin-top: 0.25rem; }
    .msg .bubble video.gen-video {
      max-width: 100%;
      border-radius: 0.5rem;
      display: block;
      margin-top: 0.25rem;
    }
    .msg .bubble .gen-meta {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 0.35rem;
      word-break: break-all;
    }
    @media (max-width: 768px) { .sidebar { display: none; } .msg { max-width: 90%; } }
  </style>
</head>

<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">◈</div>
      <div class="brand-text">
        <div class="brand-title">Private AI</div>
        <div class="brand-sub">Local inference stack</div>
      </div>
    </div>

    <div class="section">
      <label>Model</label>
      <select id="model" class="form-select form-select-sm">
        <option value="">Select a model</option>
      </select>
      <div id="modelMeta" class="model-meta"></div>
    </div>

    <div class="section">
      <label>Server health</label>
      <div class="stat">
        <div class="d-flex justify-content-between"><span class="val" id="gpuMem">—</span><span class="lbl">GPU mem</span></div>
        <div class="d-flex justify-content-between mt-2"><span class="val" id="uptime">—</span><span class="lbl">Uptime</span></div>
        <div class="d-flex justify-content-between mt-2"><span class="val" id="modelCount">—</span><span class="lbl">Models</span></div>
      </div>
    </div>

    <div class="section">
      <label>Generation stats</label>
      <div class="stat">
        <div class="d-flex justify-content-between"><span class="val" id="tokens">—</span><span class="lbl">Tokens</span></div>
        <div class="d-flex justify-content-between mt-2"><span class="val" id="tokPerSec">—</span><span class="lbl">tok/s</span></div>
        <div class="d-flex justify-content-between mt-2"><span class="val" id="genTime">—</span><span class="lbl">Time</span></div>
      </div>
    </div>

    <div class="section">
      <label>Pull model</label>
      <div class="d-flex gap-2">
        <input id="pullSearch" class="form-control form-control-sm" placeholder="Search HuggingFace Hub…">
        <button id="pullSearchBtn" class="btn btn-outline-secondary btn-sm" title="Search the Hub"><i class="fas fa-search"></i></button>
      </div>
      <select id="hubSelect" class="form-select form-select-sm mt-2" style="display:none;">
        <option value="">Select a model to pull…</option>
      </select>
      <div class="d-flex gap-2 mt-2">
        <button id="pullBtn" class="btn btn-outline-primary btn-sm flex-fill"><i class="fas fa-download me-1"></i>Pull selected</button>
      </div>
      <div id="pullProgressWrap" style="display:none; margin-top:0.5rem;">
        <div class="progress" style="height:6px;">
          <div id="pullProgressBar" class="progress-bar" role="progressbar" style="width:0%"></div>
        </div>
      </div>
      <div id="pullStatus" class="small" style="color:var(--text-muted); font-size:0.75rem; display:none;"></div>
    </div>

    <div class="section">
      <label>Services</label>
      <div id="servicesPanel" class="services-panel">
        <div class="small" style="color:var(--text-muted)">Checking…</div>
      </div>
      <button id="setupWizardBtn" class="btn btn-outline-secondary btn-sm mt-2 w-100">
        <i class="fas fa-wrench me-1"></i>Setup wizard
      </button>
    </div>

    <div class="section">
      <label>Actions</label>
      <button id="refreshModels" class="btn btn-outline-secondary btn-sm"><i class="fas fa-sync-alt me-1"></i>Refresh models</button>
      <button id="clearChat" class="btn btn-outline-secondary btn-sm"><i class="fas fa-trash me-1"></i>Clear chat</button>
      <button id="stopBtn" class="btn btn-outline-danger btn-sm" disabled><i class="fas fa-stop me-1"></i>Stop</button>
    </div>

    <div class="sidebar-toggle">
      <span class="sidebar-toggle-label">Collapse</span>
      <button id="sidebarToggleBtn" class="sidebar-toggle-btn" title="Toggle sidebar">
        <i class="fas fa-angle-left"></i><i class="fas fa-angle-right"></i>
      </button>
    </div>
  </aside>

  <!-- Setup wizard modal -->
  <div class="modal fade" id="setupWizardModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
      <div class="modal-content" style="background:var(--bg-2); color:var(--text); border:1px solid var(--border);">
        <div class="modal-header" style="border-color:var(--border);">
          <h5 class="modal-title"><i class="fas fa-wrench me-2"></i>Sibling setup wizard</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="setupWizardBody">
          <div class="small" style="color:var(--text-muted)">Loading…</div>
        </div>
        <div class="modal-footer" style="border-color:var(--border);">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Main -->
  <main class="main">
    <div class="chat-header">
      <h5><i class="fas fa-comments me-2"></i>Chat</h5>
      <span id="serverStatus" class="badge bg-secondary">Connecting…</span>
      <div class="ms-auto d-flex align-items-center gap-2">
        <label class="small mb-0" style="color:var(--text-muted)">Stream</label>
        <div class="form-check form-switch mb-0">
          <input class="form-check-input" type="checkbox" id="streamToggle" checked>
        </div>
      </div>
    </div>

    <div id="messages" class="messages"></div>

    <div class="input-area">
      <div class="mode-tabs">
        <button class="mode-tab active" data-mode="chat"><i class="fas fa-comments me-1"></i>Chat</button>
        <button class="mode-tab" data-mode="image"><i class="fas fa-image me-1"></i>Image</button>
        <button class="mode-tab" data-mode="video"><i class="fas fa-video me-1"></i>Video</button>
        <button class="mode-tab" data-mode="audio"><i class="fas fa-volume-up me-1"></i>Audio</button>
      </div>
      <div class="input-row">
        <textarea id="message" placeholder="Type your message here… (Enter to send, Shift+Enter for newline)"></textarea>
        <button id="submit" class="btn btn-primary"><i class="fas fa-paper-plane"></i></button>
      </div>
      <div id="generationStatus" class="gen-status" style="display:none;"></div>
      <div class="input-hint" id="inputHint">Responses stream in real time. Reasoning models show their thinking.</div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script src="/static/app.js?v=6"></script>
</body>

</html>
