<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private AI — Chat</title>
  <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css'
    integrity='sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A=='
    crossorigin='anonymous' referrerpolicy='no-referrer' />
  <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'
    integrity='sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH' crossorigin='anonymous'>
  <style>
    :root {
      --bg: #0f172a;
      --bg-2: #1e293b;
      --bg-3: #334155;
      --accent: #6366f1;
      --accent-2: #8b5cf6;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --border: #334155;
      --user-bubble: #4f46e5;
      --assistant-bubble: #1e293b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      overflow: hidden;
    }
    /* Sidebar */
    .sidebar {
      width: 280px;
      background: var(--bg-2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      padding: 1rem;
      gap: 1rem;
      overflow-y: auto;
    }
    .sidebar h5 { color: var(--text); font-weight: 600; margin: 0; display: flex; align-items: center; gap: 0.5rem; }
    .sidebar .section { display: flex; flex-direction: column; gap: 0.5rem; }
    .sidebar label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin: 0; }
    .form-select, .form-control {
      background: var(--bg) !important;
      color: var(--text) !important;
      border: 1px solid var(--border) !important;
      border-radius: 0.5rem;
    }
    .form-select:focus, .form-control:focus {
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 0.2rem rgba(99,102,241,0.25) !important;
    }
    .btn { border-radius: 0.5rem; font-weight: 500; }
    .btn-primary { background: var(--accent); border: none; }
    .btn-primary:hover { background: var(--accent-2); }
    .btn-outline-secondary { color: var(--text); border-color: var(--border); }
    .btn-outline-secondary:hover { background: var(--bg-3); color: var(--text); border-color: var(--bg-3); }
    .stat {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.6rem;
    }
    .stat .val { font-size: 1.1rem; font-weight: 600; }
    .stat .lbl { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
    .badge { font-size: 0.7rem; }
    .model-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.6rem;
      margin-top: 0.25rem;
      display: none;
    }
    /* Main */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .chat-header {
      padding: 0.75rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--bg-2);
    }
    .chat-header h5 { margin: 0; font-weight: 600; }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .msg { max-width: 78%; display: flex; flex-direction: column; gap: 0.25rem; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.assistant { align-self: flex-start; align-items: flex-start; }
    .bubble {
      padding: 0.7rem 1rem;
      border-radius: 1rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 0.95rem;
    }
    .msg.user .bubble { background: var(--user-bubble); color: #fff; border-bottom-right-radius: 0.25rem; }
    .msg.assistant .bubble { background: var(--assistant-bubble); border: 1px solid var(--border); border-bottom-left-radius: 0.25rem; }
    .msg .meta { font-size: 0.7rem; color: var(--text-muted); }
    .think {
      background: rgba(148,163,184,0.12);
      border-radius: 0.5rem;
      padding: 0.5rem 0.75rem;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      max-height: 150px;
      overflow-y: auto;
      border-left: 3px solid var(--accent);
    }
    .think::before { content: '🧠 Reasoning'; display: block; font-weight: 600; font-size: 0.7rem; margin-bottom: 0.25rem; }
    .copy-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 0.35rem;
      padding: 0.15rem 0.5rem;
      font-size: 0.7rem;
      cursor: pointer;
    }
    .copy-btn:hover { color: var(--text); border-color: var(--text-muted); }
    .writing { color: var(--text-muted); font-style: italic; font-size: 0.9rem; }
    .writing::after { content: '▋'; animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    /* Input */
    .input-area { padding: 1rem 1.5rem; border-top: 1px solid var(--border); background: var(--bg-2); }
    .input-row { display: flex; gap: 0.5rem; max-width: 900px; margin: 0 auto; }
    .input-row textarea {
      flex: 1;
      resize: none;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      min-height: 48px;
      max-height: 180px;
    }
    .input-row textarea:focus { outline: none; border-color: var(--accent); }
    .input-row button { border-radius: 0.75rem; padding: 0 1.25rem; font-size: 1rem; }
    .input-hint { text-align: center; font-size: 0.7rem; color: var(--text-muted); margin-top: 0.5rem; }
    @media (max-width: 768px) { .sidebar { display: none; } .msg { max-width: 90%; } }
  </style>
</head>

<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <h5><i class="fas fa-robot me-1"></i>Private AI</h5>

    <div class="section">
      <label>Model</label>
      <select id="model" class="form-select form-select-sm">
        <option value="">Select a model</option>
      </select>
      <div id="modelMeta" class="model-meta"></div>
    </div>

    <div class="section">
      <label>Server health</label>
      <div class="stat">
        <div class="d-flex justify-content-between"><span class="val" id="gpuMem">—</span><span class="lbl">GPU mem</span></div>
        <div class="d-flex justify-content-between mt-2"><span class="val" id="uptime">—</span><span class="lbl">Uptime</span></div>
        <div class="d-flex justify-content-between mt-2"><span class="val" id="modelCount">—</span><span class="lbl">Models</span></div>
      </div>
    </div>

    <div class="section">
      <label>Generation stats</label>
      <div class="stat">
        <div class="d-flex justify-content-between"><span class="val" id="tokens">—</span><span class="lbl">Tokens</span></div>
        <div class="d-flex justify-content-between mt-2"><span class="val" id="tokPerSec">—</span><span class="lbl">tok/s</span></div>
        <div class="d-flex justify-content-between mt-2"><span class="val" id="genTime">—</span><span class="lbl">Time</span></div>
      </div>
    </div>

    <div class="section">
      <label>Pull model</label>
      <input id="pullInput" class="form-control form-control-sm" placeholder="hf.co/org/repo or path.gguf">
      <div class="d-flex gap-2">
        <button id="pullBtn" class="btn btn-outline-primary btn-sm flex-fill"><i class="fas fa-download me-1"></i>Pull</button>
      </div>
      <div id="pullStatus" class="small" style="color:var(--text-muted); font-size:0.75rem; display:none;"></div>
    </div>

    <div class="section">
      <label>Actions</label>
      <button id="refreshModels" class="btn btn-outline-secondary btn-sm"><i class="fas fa-sync-alt me-1"></i>Refresh models</button>
      <button id="clearChat" class="btn btn-outline-secondary btn-sm"><i class="fas fa-trash me-1"></i>Clear chat</button>
      <button id="stopBtn" class="btn btn-outline-danger btn-sm" disabled><i class="fas fa-stop me-1"></i>Stop</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="chat-header">
      <h5><i class="fas fa-comments me-2"></i>Chat</h5>
      <span id="serverStatus" class="badge bg-secondary">Connecting…</span>
      <div class="ms-auto d-flex align-items-center gap-2">
        <label class="small mb-0" style="color:var(--text-muted)">Stream</label>
        <div class="form-check form-switch mb-0">
          <input class="form-check-input" type="checkbox" id="streamToggle" checked>
        </div>
      </div>
    </div>

    <div id="messages" class="messages"></div>

    <div class="input-area">
      <div class="input-row">
        <textarea id="message" placeholder="Type your message here… (Enter to send, Shift+Enter for newline)"></textarea>
        <button id="submit" class="btn btn-primary"><i class="fas fa-paper-plane"></i></button>
      </div>
      <div class="input-hint">Responses stream in real time. Reasoning models show their thinking.</div>
    </div>
  </main>

  <script src="/static/app.js"></script>
</body>

</html>
