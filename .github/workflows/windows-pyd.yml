# Windows Rust Core (.pyd) build — CI workflow
#
# Builds the inference_core_rb PyO3 extension as a native Windows .pyd wheel
# (cp3xx-win_amd64) so private-ai-server can use the Rust continuous-batching +
# speculative-decoding engine from Issue #3/#4. Runs on a Windows GitHub runner
# because the deploy target is Windows-hosted Python (WSL produces a .so, not
# the MSVC .pyd the PyInstaller bundle needs).
#
# Note: pyo3 0.20 caps at CPython 3.12, so we set
# PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 to build against 3.13 via the stable ABI.

name: Windows Rust Core (.pyd) build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'inference_core_rb/**'
      - '.github/workflows/windows-pyd.yml'
  pull_request:
    paths:
      - 'inference_core_rb/**'

jobs:
  build-windows-pyd:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: inference_core_rb
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: python -m pip install --upgrade pip maturin

      - name: Rust unit tests
        run: cargo test --release
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: '1'

      - name: Build wheel (.pyd)
        run: maturin build --release --interpreter python
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: '1'

      - name: Install wheel + import smoke test
        shell: pwsh
        run: |
          python -m pip install --force-reinstall (Get-ChildItem target/wheels/*.whl).FullName
          python -c "from inference_core_rb import BatchCoordinator, TokenBatchRequest; print('OK: inference_core_rb importable as .pyd')"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: inference-core-rb-wheel
          path: inference_core_rb/target/wheels/*.whl
          if-no-files-found: error
