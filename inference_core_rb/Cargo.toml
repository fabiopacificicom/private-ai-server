[package]
name = "inference-core-rb"
version = "0.1.0"
edition = "2021"
description = "PyO3 continuous-batching + speculative-decoding inference core for private-ai-server"
license = "MIT"

[lib]
name = "inference_core_rb"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
pyo3-asyncio = { version = "0.20", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
numpy = "0.20"

[profile.release]
lto = true
opt-level = 3
