[package]
name = "private-ai-desktop"
version = "1.1.0"
description = "Desktop wrapper for Private AI Inference Server"
edition = "2021"

[lib]
name = "private_ai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
